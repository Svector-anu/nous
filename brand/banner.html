<!doctype html><html><head><meta charset="utf-8"><style>
  @import url('');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1500px; height:500px; overflow:hidden;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:#080c10; }
  .wrap { position:relative; width:1500px; height:500px; display:flex;
    align-items:center; padding:0 96px; }
  /* the world curving away, same language as the boot screen */
  .horizon { position:absolute; left:-10%; bottom:-118%; width:120%; height:190%;
    border-radius:50%;
    background: radial-gradient(circle at 50% 0%, #16341f 0%, #0d1d13 45%, #080c10 72%);
    box-shadow: 0 -1px 90px rgba(110,226,116,0.14); }
  .glow { position:absolute; left:50%; top:-40%; width:900px; height:900px;
    transform:translateX(-50%); pointer-events:none;
    background: radial-gradient(circle, rgba(110,226,116,0.13) 0%, rgba(110,226,116,0) 62%); }
  /* scattered settlement lights along the curve */
  .lights { position:absolute; inset:0; }
  .lights i { position:absolute; width:3px; height:3px; border-radius:50%;
    background:#ffb457; box-shadow:0 0 7px rgba(255,180,87,0.9); }
  .content { position:relative; z-index:2; }
  .mark { display:flex; align-items:center; gap:26px; margin-bottom:22px; }
  .mark svg { width:82px; height:82px; filter:drop-shadow(0 0 22px rgba(110,226,116,0.45)); }
  .word { font-size:76px; font-weight:700; letter-spacing:.30em; color:#fff;
    text-transform:uppercase; line-height:1; }
  .line { font-size:27px; color:#c3ccc6; letter-spacing:.005em; margin-bottom:20px; }
  .line b { color:#fff; font-weight:600; }
  .meta { display:flex; align-items:center; gap:14px; font-size:15px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing:.13em; text-transform:uppercase; color:#6ee274; }
  .meta .dot { color:#39503f; }
  .url { position:absolute; right:96px; bottom:52px; z-index:2;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size:23px; letter-spacing:.13em; color:#6ee274;
    border:1px solid rgba(110,226,116,.42); border-radius:999px; padding:11px 26px;
    background:rgba(110,226,116,.07); }
</style></head><body>
<div class="wrap">
  <div class="horizon"></div><div class="glow"></div>
  <div class="lights" id="l"></div>
  <div class="content">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6ee274" stroke-width="1.3"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="7.4"/>
        <line x1="12" y1="1.4" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22.6"/>
        <line x1="1.4" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22.6" y2="12"/>
        <path d="M12 8.4l1.1 2.5 2.5 1.1-2.5 1.1L12 15.6l-1.1-2.5L8.4 12l2.5-1.1z"
              fill="#6ee274" stroke="none"/>
      </svg>
      <div class="word">Nous</div>
    </div>
    <div class="line">a civilization that runs itself. <b>nobody scripts it.</b></div>
    <div class="meta">
      <span>~120 agents</span><span class="dot">·</span>
      <span>clan leaders think</span><span class="dot">·</span>
      <span>a day every 3m20s</span>
    </div>
  </div>
  <div class="url">nous.city</div>
</div>
<script>
  // settlement lights, thickest along the curve of the world
  const l = document.getElementById('l');
  for (let i = 0; i < 130; i++) {
    const s = document.createElement('i');
    const x = Math.random() * 1500;
    const t = Math.abs(x - 750) / 750;
    const y = 372 + t * t * 96 + Math.random() * 104;
    s.style.left = x + 'px'; s.style.top = y + 'px';
    s.style.opacity = (0.25 + Math.random() * 0.75).toFixed(2);
    const sc = (0.7 + Math.random() * 1.5).toFixed(2);
    s.style.transform = `scale(${sc})`;
    l.appendChild(s);
  }
</script></body></html>
