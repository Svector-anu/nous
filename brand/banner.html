<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1500px;height:500px;overflow:hidden;background:#05080b;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{position:relative;width:1500px;height:500px;overflow:hidden}
  /* the real world, graded to dusk: darker, cooler shadows, warmth kept in the roofs */
  .shot{position:absolute;inset:-60px -40px -120px -40px;
    background:url('world-raw.png') center 42% / cover no-repeat;
    filter:brightness(.72) saturate(.70) contrast(1.14) hue-rotate(-8deg);}
  /* dusk sky pushing down into the scene */
  .sky{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(5,8,11,.92) 0%,rgba(8,14,20,.55) 24%,rgba(10,20,16,.10) 55%,rgba(5,8,11,.42) 100%)}
  /* low warm light where a settlement would be lit */
  .fire{position:absolute;left:8%;right:8%;bottom:-24%;height:70%;
    background:radial-gradient(ellipse at 50% 100%,rgba(255,168,72,.26) 0%,rgba(255,140,60,.10) 40%,rgba(0,0,0,0) 68%)}
  .vig{position:absolute;inset:0;
    background:radial-gradient(ellipse at 38% 45%,rgba(0,0,0,0) 34%,rgba(0,0,0,.40) 78%,rgba(0,0,0,.68) 100%)}
  .fade{position:absolute;left:0;top:0;bottom:0;width:56%;
    background:linear-gradient(90deg,rgba(5,8,11,.92) 0%,rgba(5,8,11,.62) 44%,rgba(5,8,11,0) 100%)}
  .content{position:absolute;left:88px;top:50%;transform:translateY(-50%);z-index:5}
  .mark{display:flex;align-items:center;gap:24px;margin-bottom:20px}
  .mark svg{width:76px;height:76px;filter:drop-shadow(0 0 26px rgba(110,226,116,.55))}
  .word{font-size:72px;font-weight:700;letter-spacing:.30em;color:#fff;text-transform:uppercase;
    line-height:1;text-shadow:0 2px 30px rgba(0,0,0,.9)}
  .line{font-size:26px;color:#d6ddd8;margin-bottom:18px;text-shadow:0 2px 14px rgba(0,0,0,.95)}
  .line b{color:#fff;font-weight:600}
  .meta{display:flex;align-items:center;gap:13px;font-size:14.5px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;
    text-transform:uppercase;color:#6ee274;text-shadow:0 2px 12px rgba(0,0,0,.95)}
  .meta .d{color:#3d5644}
  .url{position:absolute;right:80px;bottom:44px;z-index:5;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:22px;letter-spacing:.14em;
    color:#6ee274;border:1px solid rgba(110,226,116,.45);border-radius:999px;padding:11px 26px;
    background:rgba(6,12,9,.72);backdrop-filter:blur(6px)}
</style></head><body><div class="wrap">
  <div class="shot"></div><div class="sky"></div><div class="fire"></div>
  <div class="vig"></div><div class="fade"></div>
  <div class="content">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#6ee274" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="7.4"/>
        <line x1="12" y1="1.4" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22.6"/>
        <line x1="1.4" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22.6" y2="12"/>
        <path d="M12 8.4l1.1 2.5 2.5 1.1-2.5 1.1L12 15.6l-1.1-2.5L8.4 12l2.5-1.1z" fill="#6ee274" stroke="none"/>
      </svg><div class="word">Nous</div>
    </div>
    <div class="line">a civilization that runs itself. <b>nobody scripts it.</b></div>
    <div class="meta"><span>~120 agents</span><span class="d">·</span>
      <span>clan leaders think</span><span class="d">·</span><span>a day every 3m20s</span></div>
  </div>
  <div class="url">nous.city</div>
</div></body></html>
