<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neo-Civilization — live</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --line: #21262d;
    --text: #c9d1d9;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    display: flex;
    min-height: 100vh;
  }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  canvas { background: #010409; border: 1px solid var(--line); border-radius: 4px; max-width: 100%; image-rendering: pixelated; }
  aside {
    width: 240px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 16px;
  }
  h1 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 16px; }
  dl { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; margin: 0 0 20px; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
  h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  ul { list-style: none; padding: 0; margin: 0 0 20px; }
  li { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
  #status { color: var(--muted); }
  #status.live { color: #3fb950; }
  button {
    width: 100%;
    margin-bottom: 16px;
    padding: 6px 8px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
    cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  input {
    width: 100%;
    margin-bottom: 6px;
    padding: 5px 7px;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: inherit;
  }
  #deploy button { margin-bottom: 6px; }
  #deployStatus { margin: 0 0 16px; min-height: 1.5em; color: var(--muted); font-size: 11px; }
  #deployStatus.bad { color: #f85149; }
  #deployStatus.good { color: #3fb950; }
  #deployed li { display: block; margin-bottom: 8px; }
  #deployed .who { color: var(--text); }
  #deployed .note { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <div id="stage"><canvas id="map" width="768" height="768"></canvas></div>
  <aside>
    <h1>Neo-Civilization</h1>
    <dl>
      <dt>status</dt><dd id="status">connecting</dd>
      <dt>tick</dt><dd id="tick">—</dd>
      <dt>day</dt><dd id="day">—</dd>
      <dt>agents</dt><dd id="agents">—</dd>
      <dt>resources</dt><dd id="resources">—</dd>
      <dt>dormant</dt><dd id="dormant">—</dd>
      <dt>huts</dt><dd id="buildings">—</dd>
      <dt>clans</dt><dd id="clans">—</dd>
      <dt>in a clan</dt><dd id="clanned">—</dd>
      <dt>yours</dt><dd id="userAgents">—</dd>
    </dl>
    <button id="mode">colour: clan</button>
    <h2 id="legend-title">clans</h2>
    <ul id="legend"></ul>
    <h2>deploy an agent</h2>
    <form id="deploy" autocomplete="off">
      <input id="agentName" maxlength="24" placeholder="name" required>
      <input id="agentPersonality" maxlength="140" placeholder="short personality note">
      <button type="submit">deploy</button>
      <p id="deployStatus"></p>
    </form>

    <h2>your agents</h2>
    <ul id="deployed"></ul>

    <h2>World</h2>
    <ul>
      <li><span class="swatch" style="background:#1a7f37"></span>food</li>
      <li><span class="swatch" style="background:#6b5210"></span>wood</li>
      <li><span class="swatch" style="background:#c9d1d9"></span>hut</li>
      <li><span class="swatch" style="background:#1a7f37;opacity:.18"></span>dormant (regrowing)</li>
    </ul>
  </aside>

<script>
const STATE_COLORS = {
  IDLE:      "#6e7681",
  SEEK_NEED: "#58a6ff",
  GATHER:    "#3fb950",
  BUILD:     "#d29922",
  REST:      "#a371f7",
  FLEE:      "#f85149",
};

const canvas = document.getElementById("map");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

const CLANLESS = "#484f58";
const legend = document.getElementById("legend");
const legendTitle = document.getElementById("legend-title");
const modeButton = document.getElementById("mode");

let colourBy = "clan";
let lastSnapshot = null;

// Golden-angle hue steps keep adjacent clan ids visually far apart.
function clanColour(id) {
  if (id === null || id === undefined) return CLANLESS;
  return `hsl(${(id * 137.508) % 360} 70% 60%)`;
}

function agentColour(agent) {
  return colourBy === "clan"
    ? clanColour(agent.clan)
    : (STATE_COLORS[agent.state] || "#ffffff");
}

function renderLegend(snapshot) {
  legend.innerHTML = "";
  if (colourBy === "state") {
    legendTitle.textContent = "agent state";
    for (const [state, color] of Object.entries(STATE_COLORS)) {
      const item = document.createElement("li");
      item.innerHTML = `<span class="swatch" style="background:${color}"></span>${state}`;
      legend.appendChild(item);
    }
    return;
  }

  legendTitle.textContent = "clans";
  const clans = (snapshot ? snapshot.clans : []).slice().sort((a, b) => b.size - a.size);
  for (const clan of clans.slice(0, 10)) {
    const item = document.createElement("li");
    item.innerHTML =
      `<span class="swatch" style="background:${clanColour(clan.id)}"></span>` +
      `${clan.size} · ${clan.goal || "—"}`;
    legend.appendChild(item);
  }
  const item = document.createElement("li");
  item.innerHTML = `<span class="swatch" style="background:${CLANLESS}"></span>unaffiliated`;
  legend.appendChild(item);
}

const deployed = document.getElementById("deployed");
const deployStatus = document.getElementById("deployStatus");

function escapeHtml(text) {
  const node = document.createElement("span");
  node.textContent = text;
  return node.innerHTML;
}

function renderDeployed(snapshot) {
  const mine = snapshot.agents.filter((a) => a.user);
  deployed.innerHTML = "";
  if (!mine.length) {
    const empty = document.createElement("li");
    empty.className = "note";
    empty.textContent = "none yet";
    deployed.appendChild(empty);
    return;
  }
  for (const agent of mine) {
    const item = document.createElement("li");
    item.innerHTML =
      `<span class="who">${escapeHtml(agent.name)}</span> · ${agent.state}` +
      (agent.clan !== null ? ` · clan ${agent.clan}` : "") +
      (agent.personality ? `<br><span class="note">${escapeHtml(agent.personality)}</span>` : "");
    deployed.appendChild(item);
  }
}

document.getElementById("deploy").addEventListener("submit", async (event) => {
  event.preventDefault();
  const name = document.getElementById("agentName").value.trim();
  const personality = document.getElementById("agentPersonality").value.trim();
  deployStatus.className = "";
  deployStatus.textContent = "deploying…";
  try {
    const response = await fetch("/agents", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, personality }),
    });
    const body = await response.json();
    if (response.ok) {
      deployStatus.className = "good";
      deployStatus.textContent = `${name} arrives at tick ${body.arrives_at_tick}`;
      document.getElementById("agentName").value = "";
      document.getElementById("agentPersonality").value = "";
    } else {
      deployStatus.className = "bad";
      deployStatus.textContent = body.detail || "deploy failed";
    }
  } catch (error) {
    deployStatus.className = "bad";
    deployStatus.textContent = "deploy failed";
  }
});

modeButton.addEventListener("click", () => {
  colourBy = colourBy === "clan" ? "state" : "clan";
  modeButton.textContent = `colour: ${colourBy}`;
  if (lastSnapshot) draw(lastSnapshot);
});

function setText(id, value) {
  document.getElementById(id).textContent = value;
}

function draw(snapshot) {
  const { width, height } = snapshot.grid;
  const cell = Math.floor(Math.min(canvas.width / width, canvas.height / height));
  const originX = Math.floor((canvas.width - cell * width) / 2);
  const originY = Math.floor((canvas.height - cell * height) / 2);

  ctx.fillStyle = "#010409";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#0d1117";
  ctx.lineWidth = 1;
  for (let x = 0; x <= width; x += 8) {
    ctx.beginPath();
    ctx.moveTo(originX + x * cell + 0.5, originY);
    ctx.lineTo(originX + x * cell + 0.5, originY + height * cell);
    ctx.stroke();
  }
  for (let y = 0; y <= height; y += 8) {
    ctx.beginPath();
    ctx.moveTo(originX, originY + y * cell + 0.5);
    ctx.lineTo(originX + width * cell, originY + y * cell + 0.5);
    ctx.stroke();
  }

  for (const node of snapshot.resources) {
    const depleted = node.amount <= 0;
    ctx.globalAlpha = depleted ? 0.18 : 0.35 + 0.65 * (node.amount / node.max);
    ctx.fillStyle = node.kind === "FOOD" ? "#1a7f37" : "#6b5210";
    ctx.fillRect(originX + node.x * cell, originY + node.y * cell, cell, cell);
  }
  ctx.globalAlpha = 1;

  for (const building of snapshot.buildings) {
    ctx.fillStyle = "#c9d1d9";
    ctx.fillRect(originX + building.x * cell, originY + building.y * cell, cell, cell);
  }

  // soft influence: a tinted disc per clan, no hard boundary
  for (const clan of snapshot.clans || []) {
    if (!clan.centre || !clan.influence) continue;
    const cx = originX + (clan.centre[0] + 0.5) * cell;
    const cy = originY + (clan.centre[1] + 0.5) * cell;
    const r = clan.influence * cell;
    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    gradient.addColorStop(0, clanColour(clan.id));
    gradient.addColorStop(1, "transparent");
    ctx.globalAlpha = 0.16;
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  const radius = Math.max(1.5, cell * 0.4);
  for (const agent of snapshot.agents) {
    const cx = originX + agent.x * cell + cell / 2;
    const cy = originY + agent.y * cell + cell / 2;
    ctx.fillStyle = agentColour(agent);
    ctx.beginPath();
    ctx.arc(cx, cy, agent.user ? radius * 1.4 : radius, 0, Math.PI * 2);
    ctx.fill();
    if (agent.user) {
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
  }

  setText("tick", snapshot.tick);
  setText("day", snapshot.day);
  setText("agents", snapshot.stats.agents);
  setText("resources", snapshot.stats.resources);
  setText("dormant", snapshot.stats.dormant);
  setText("buildings", snapshot.stats.buildings);
  setText("clans", snapshot.stats.clans);
  setText("clanned", snapshot.stats.clanned);
  setText("userAgents", snapshot.stats.user_agents);
  renderDeployed(snapshot);

  lastSnapshot = snapshot;
  renderLegend(snapshot);
}

let socket = null;
let retryDelay = 500;

function connect() {
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  socket = new WebSocket(`${protocol}//${location.host}/ws`);

  socket.onopen = () => {
    retryDelay = 500;
    statusEl.textContent = "live";
    statusEl.className = "live";
  };
  socket.onmessage = (event) => draw(JSON.parse(event.data));
  socket.onclose = () => {
    statusEl.textContent = "reconnecting";
    statusEl.className = "";
    setTimeout(connect, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 10000);
  };
  socket.onerror = () => socket.close();
}

connect();
</script>
</body>
</html>
